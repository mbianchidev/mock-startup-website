name: Deploy to Vercel

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 58.7.1

jobs:
  preview:
    name: Deploy preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Vercel build output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy Vercel preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "${VERCEL_TOKEN}" || { echo "::error::Missing required repository secret: VERCEL_TOKEN"; exit 1; }
          test -n "${VERCEL_ORG_ID}" || { echo "::error::Missing required repository secret: VERCEL_ORG_ID"; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "::error::Missing required repository secret: VERCEL_PROJECT_ID"; exit 1; }
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --yes --token=${VERCEL_TOKEN}

  production:
    name: Deploy production
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mbianchi.dev
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Vercel build output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy Vercel production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "${VERCEL_TOKEN}" || { echo "::error::Missing required repository secret: VERCEL_TOKEN"; exit 1; }
          test -n "${VERCEL_ORG_ID}" || { echo "::error::Missing required repository secret: VERCEL_ORG_ID"; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "::error::Missing required repository secret: VERCEL_PROJECT_ID"; exit 1; }
          npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --yes --prod --token=${VERCEL_TOKEN}
